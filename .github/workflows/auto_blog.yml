name: 자동 블로그 파이프라인 통합

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: "실행 작업 선택"
        required: true
        default: "publish"
        type: choice
        options:
          - publish
          - refresh
      title:
        description: "블로그 제목 (비워두면 10000회 이상 조회수 큐에서 자동 발췌)"
        required: false
        default: ""
  schedule:
    - cron: "*/30 * * * *"   # 30분 간격으로 써치 및 포스팅 (일일 최대 5회로 스크립트 내부 제어됨)

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 무료 한글 폰트 다운로드 (나눔고딕)
        run: |
          curl -fsSL -o font.ttf \
            "[https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Bold.ttf](https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Bold.ttf)" \
            --max-time 30 || echo "폰트 다운로드 실패, 기본 폰트로 대체됩니다."

      - name: 필요 패키지 설치
        run: pip install requests pillow

      - name: 블로그 발행 실행 (써치 및 트래픽 필터 자동 연동)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
          SITE_TAGLINE: ${{ vars.SITE_TAGLINE }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          ENABLE_AUTO_TRANSLATE: ${{ vars.ENABLE_AUTO_TRANSLATE }}
          SITE_URL: ${{ vars.SITE_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
          ADSENSE_SLOT_ID: ${{ vars.ADSENSE_SLOT_ID }}
          COUPANG_PARTNER_TAG: ${{ secrets.COUPANG_PARTNER_TAG }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          WORDPRESS_URL: ${{ vars.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.action_type }}" == "refresh" ]; then
            python generate_post.py refresh
          else
            python generate_post.py "${{ github.event.inputs.title }}"
          fi

      - name: 변경사항 커밋 및 push
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "auto-blog-bot@users.noreply.github.com"
          git add docs keywords_queue.json
          git diff --cached --quiet && echo "변경사항 없음, 커밋 생략" || git commit -m "자동 파이프라인 실행: $(date +'%Y-%m-%d %H:%M')"
          git push
