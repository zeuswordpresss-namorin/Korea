name: 자동 블로그 파이프라인 통합

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: "실행 작업 선택"
        required: true
        default: "publish"
        type: choice
        options:
          - publish
          - refresh
      title:
        description: "블로그 제목 (publish 선택 시, 비워두면 큐에서 자동 사용)"
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * *"   # 매일 UTC 00:00 = 한국시간 오전 9시 (자동 포스팅)
    - cron: "0 22 * * 0"  # 매주 일요일 UTC 22:00 = 한국시간 월요일 오전 7시 (키워드 보충)

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 무료 한글 폰트 다운로드 (나눔고딕)
        run: |
          curl -fsSL -o font.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Bold.ttf" \
            --max-time 30 || echo "폰트 다운로드 실패, 기본 폰트로 대체됩니다."

      - name: 필요 패키지 설치
        run: pip install requests pillow

      - name: 키워드 자동 보충 실행
        if: (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action_type == 'refresh')
        run: python generate_post.py refresh

      - name: 블로그 발행 실행
        if: (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action_type == 'publish')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
          SITE_TAGLINE: ${{ vars.SITE_TAGLINE }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          ENABLE_AUTO_TRANSLATE: ${{ vars.ENABLE_AUTO_TRANSLATE }}
          SITE_URL: ${{ vars.SITE_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
          ADSENSE_SLOT_ID: ${{ vars.ADSENSE_SLOT_ID }}
          COUPANG_PARTNER_TAG: ${{ secrets.COUPANG_PARTNER_TAG }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python generate_post.py "${{ github.event.inputs.title }}"

      - name: 변경사항 커밋 및 push
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "auto-blog-bot@users.noreply.github.com"
          git add docs keywords_queue.json
          git diff --cached --quiet && echo "변경사항 없음, 커밋 생략" || git commit -m "자동 파이프라인 실행: $(date +'%Y-%m-%d %H:%M')"
          git push
